version: '1.0'
name: pipeline-linux-x86_64
displayName: Linux x86_64 构建
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - ''
stages:
  - name: build-linux-x86_64
    displayName: Linux x86_64 编译
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@gcc
        name: build_gcc
        displayName: GCC 构建
        gccVersion: '9.4'
        commands:
          - 'echo "TDS_CFG=v15"'
          - '# 安装编译依赖（gcc/g++、make、libssl、libkrb5、file）'
          - export DEBIAN_FRONTEND=noninteractive
          - apt-get update && apt-get install -y gcc g++ make file libssl-dev libkrb5-dev
          - '# 限制并行数，避免 CI 免费节点 OOM（build.sh 默认取 nproc 会虚高）'
          - export JOBS=2
          - cd build
          - bash build.sh x86_64
          - '# 打包发布物：package.sh 直接产出扁平包 tds-{提交次数}-linux-x86_64-{yyMMddHHmmss}.tar.gz（包内仅 tds，无目录）'
          - bash package.sh x86_64
          - '# 返回工作区根目录'
          - 'cd ..'
          - '# 删除版本目录，out/dist 只保留扁平包'
          - 'PKG="$(basename "$(ls -d out/dist/tds-*-linux-x86_64-*/ | sort | tail -1)")"'
          - 'rm -rf "out/dist/${PKG}"'
          - 'ls -la out/dist/'
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./out/dist
        caches: []
        notify: []
        strategy:
          retry: '0'
  - name: release
    displayName: 发布 Gitee Release
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: release@gitee
        name: release_gitee
        displayName: Gitee Release
        releaseName: tds-${GITEE_PIPELINE_BUILD_NUMBER}-linux-x86_64
        tagName: tds-${GITEE_PIPELINE_BUILD_NUMBER}-linux-x86_64
        description: TDS Linux x86_64 自动构建发布包，附件 tds-{提交次数}-linux-x86_64-{yyMMddHHmmss}.tar.gz（扁平包，仅含 tds 可执行文件）。
        upstreamArtifact:
          - BUILD_ARTIFACT
        assertFiles:
          - ./tds-*.tar.gz
        prerelease: false
        allowUpdate: true
        notify: []
        strategy:
          retry: '0'
