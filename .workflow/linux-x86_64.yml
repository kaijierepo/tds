version: '1.0'
# ============================================================
# 流水线配置版本标识：TDS_CFG=v13
# 编辑界面保存本文件后，重新触发构建，build 阶段第一条日志会打印
# "TDS_CFG=v13"。拷贝日志时搜索该标识即可确认编辑界面配置已更新。
#
# 相对 v12 的变更：
#   - 包名日期后缀由 {yyMMdd} 改为 {yyMMddHHmmss}（精确到秒，
#     避免同日多次构建版本名冲突），package.sh 同步修改。
#
# v12 已实现（保留）：
#   - 不再依赖 GITEE_PARAMS 动态参数（build@gcc 环境为空，v10/v11 因此失败）：
#       * build 阶段内部解析版本目录生成扁平包（无需流水线变量）
#       * artifacts/assertFiles 用固定名 release-package.tar.gz（v8 验证最稳）
#       * releaseName/tagName 用系统变量 GITEE_PIPELINE_BUILD_NUMBER
#         （系统级参数，任何任务可用，v7 已验证；放弃 commit 短哈希方案）
#
# v11 已实现（保留）：
#   - 版本串无 v 前缀：包名 tds-{提交次数}-linux-x86_64-{yyMMddHHmmss}.tar.gz
#   - 包结构: 扁平 tds，无嵌套目录
#
# 说明：Gitee Release 页"下载 Source code (zip/tar.gz)"是平台内置固定功能，
#       release@gitee 插件不支持关闭，无法通过 yml 关掉。
# ============================================================
name: pipeline-linux-x86_64
displayName: Linux x86_64 构建
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - ''
stages:
  - name: build-linux-x86_64
    displayName: Linux x86_64 编译
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@gcc
        name: build_gcc
        displayName: GCC 构建
        gccVersion: '9.4'
        commands:
          - 'echo "TDS_CFG=v13"'
          - '# 安装编译依赖（gcc/g++、make、libssl、libkrb5、file）'
          - export DEBIAN_FRONTEND=noninteractive
          - apt-get update && apt-get install -y gcc g++ make file libssl-dev libkrb5-dev
          - '# 限制并行数，避免 CI 免费节点 OOM（build.sh 默认取 nproc 会虚高）'
          - export JOBS=2
          - cd build
          - bash build.sh x86_64
          - '# 打包发布物：out/dist/tds-{提交次数}-linux-x86_64-{yyMMddHHmmss}/tds（含嵌套目录）'
          - bash package.sh x86_64
          - '# 返回工作区根目录'
          - 'cd ..'
          - '# 解析实际版本目录（out/dist/tds-{提交次数}-linux-x86_64-{yyMMddHHmmss}/），重新打包为扁平结构（包内仅 tds）'
          - 'PKG="$(basename "$(ls -d out/dist/tds-*-linux-x86_64-*/ | sort | tail -1)")"'
          - 'cd "out/dist/${PKG}" && tar czf "../../${PKG}.tar.gz" tds && cd ../..'
          - '# 复制固定名到根目录：release 插件还原 artifact 时会平铺，根目录文件路径最稳'
          - 'cp -f "${PKG}.tar.gz" release-package.tar.gz'
          - 'ls -la release-package.tar.gz "${PKG}.tar.gz" out/dist/'
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./release-package.tar.gz
        caches: []
        notify: []
        strategy:
          retry: '0'
  - name: release
    displayName: 发布 Gitee Release
    strategy: naturally
    trigger: manual
    executor: []
    steps:
      - step: release@gitee
        name: release_gitee
        displayName: Gitee Release
        releaseName: tds-${GITEE_PIPELINE_BUILD_NUMBER}-linux-x86_64
        tagName: tds-${GITEE_PIPELINE_BUILD_NUMBER}-linux-x86_64
        description: TDS Linux x86_64 自动构建发布包，包名 tds-{提交次数}-linux-x86_64-{yyMMddHHmmss}.tar.gz（附件以固定名 release-package.tar.gz 上传），包内仅含 tds 可执行文件。
        upstreamArtifact:
          - BUILD_ARTIFACT
        assertFiles:
          - ./release-package.tar.gz
        prerelease: false
        allowUpdate: true
        notify: []
        strategy:
          retry: '0'
