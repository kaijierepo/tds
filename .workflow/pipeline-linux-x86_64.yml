version: '1.0'
name: pipeline-linux-x86_64
displayName: Linux x86_64 构建
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - ''
stages:
  - name: build-linux-x86_64
    displayName: Linux x86_64 编译
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@gcc
        name: build_gcc
        displayName: GCC 构建
        gccVersion: '9.4'
        commands:
          - '# 安装编译依赖（gcc/g++、make、libssl、libkrb5、file）'
          - export DEBIAN_FRONTEND=noninteractive
          - apt-get update && apt-get install -y gcc g++ make file libssl-dev libkrb5-dev
          - '# 限制并行数，避免 CI 免费节点 OOM（build.sh 默认取 nproc 会虚高）'
          - export JOBS=2
          - '# 版本号统一用流水线构建号（系统参数，任何任务内可用），不依赖 GITEE_PARAMS 传参'
          - 'export TDS_VERSION_OVERRIDE="tds-v${GITEE_PIPELINE_BUILD_NUMBER:-unknown}-linux-x86_64"'
          - 'echo "构建版本号: ${TDS_VERSION_OVERRIDE}"'
          - cd build
          - bash build.sh x86_64
          - '# 打包发布物：out/dist/tds-v{构建号}-linux-x86_64.tar.gz'
          - bash package.sh x86_64
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./out/dist
        caches: []
        notify: []
        strategy:
          retry: '0'
  - name: release
    displayName: 发布 Gitee Release
    strategy: naturally
    trigger: manual
    executor: []
    steps:
      - step: release@gitee
        name: release_gitee
        displayName: Gitee Release
        releaseName: tds-v${GITEE_PIPELINE_BUILD_NUMBER}-linux-x86_64
        tagName: tds-v${GITEE_PIPELINE_BUILD_NUMBER}-linux-x86_64
        description: TDS Linux x86_64 自动构建发布包，产物见附件。
        upstreamArtifact:
          - BUILD_ARTIFACT
        assertFiles:
          - out/dist/tds-v${GITEE_PIPELINE_BUILD_NUMBER}-linux-x86_64.tar.gz
        prerelease: false
        allowUpdate: true
        notify: []
        strategy:
          retry: '0'
