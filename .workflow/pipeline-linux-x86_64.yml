version: '1.0'
name: pipeline-linux-x86_64
displayName: Linux x86_64 构建
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - ''
stages:
  - name: build-linux-x86_64
    displayName: Linux x86_64 编译
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@gcc
        name: build_gcc
        displayName: GCC 构建
        gccVersion: '9.4'
        commands:
          - '# 安装编译依赖（gcc/g++、make、libssl、libkrb5、file）'
          - export DEBIAN_FRONTEND=noninteractive
          - apt-get update && apt-get install -y gcc g++ make file libssl-dev libkrb5-dev
          - '# 限制并行数，避免 CI 免费节点 OOM（build.sh 默认取 nproc 会虚高）'
          - export JOBS=2
          - '# 进入 build 目录执行 x86_64 release 构建'
          - cd build
          - bash build.sh x86_64
          - '# 打包发布物：out/dist/tds-v{提交次数}-linux-x86_64.tar.gz'
          - bash package.sh x86_64
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./out/dist
        caches: []
        notify: []
        strategy:
          retry: '0'
  - name: release
    displayName: 发布 Gitee Release
    strategy: naturally
    trigger: manual
    executor: []
    steps:
      - step: build@gcc
        name: calc_version
        displayName: 计算版本号
        gccVersion: '9.4'
        commands:
          - '# 手动触发 release 阶段不会执行 build 阶段，需要自己算版本号（git 提交次数）'
          - REV_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 0)
          - echo "TDS_VERSION=tds-v${REV_COUNT}-linux-x86_64" >> "$GITEE_PARAMS"
          - cat "$GITEE_PARAMS"
      - step: release@gitee
        name: release_gitee
        displayName: Gitee Release
        releaseName: ${TDS_VERSION}
        tagName: ${TDS_VERSION}
        # 发布说明（body）必填，不能为空
        deion: TDS ${TDS_VERSION} Linux x86_64 自动构建发布包，产物见附件。
        description: TDS ${TDS_VERSION} Linux x86_64 自动构建发布包，产物见附件。
        upstreamArtifact:
          - BUILD_ARTIFACT
        assertFiles:
          - out/dist/${TDS_VERSION}.tar.gz
        prerelease: false
        allowUpdate: true
        notify: []
        strategy:
          retry: '0'
